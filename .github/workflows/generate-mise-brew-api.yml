name: Generate mise Homebrew API metadata

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - "Casks/**"
      - "script/generate-mise-brew-api.rb"
      - ".github/workflows/generate-mise-brew-api.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-mise-brew-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API metadata
        run: |
          brew untap --force ascarter/extras || true
          brew tap ascarter/extras
          brew trust --tap ascarter/extras
          brew ruby script/generate-mise-brew-api.rb

      - name: Commit generated metadata
        run: |
          if [ -z "$(git status --porcelain -- api)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api
          git commit -m "chore(api): regenerate mise Homebrew metadata"
          git push origin HEAD:main

      - name: Restore Homebrew tap link
        if: always()
        run: |
          brew untap --force ascarter/extras || true
          brew tap --custom-remote ascarter/extras "$GITHUB_WORKSPACE"
